{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar atención | Empanadas ED</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header class="site-header"><div class="header-inner">
        <a href="{% url 'gestion_admin:admin_panel' %}" class="logo-button" aria-label="Volver al panel"><img class="logo-image" src="{% static 'ed.jpeg' %}" alt="Logo de Empanadas ED"></a>
        <h1 class="brand-title">Atención al cliente</h1>
        <nav class="site-nav"><a href="{% url 'gestion_admin:reportes_admin' %}">Reportes</a><a href="{% url 'gestion_admin:logout' %}">Cerrar sesión</a></nav>
    </div></header>
    <main class="auth-shell">
        <section class="auth-card">
            <h1>Registrar atención</h1>
            <p>Deja la primera respuesta vacía mientras el caso siga pendiente.</p>
            <form method="post" class="form-grid">
                {% csrf_token %}
                {% for field in form %}<div class="form-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
                <div class="form-actions"><button class="btn btn-primary" type="submit">Guardar atención</button><a class="button-secondary" href="{% url 'gestion_admin:reportes_admin' %}">Cancelar</a></div>
            </form>
        </section>
    </main>
</body>
</html>
