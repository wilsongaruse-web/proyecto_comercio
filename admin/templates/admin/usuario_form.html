{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear administrador</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="{% url 'gestion_admin:admin_panel' %}" class="logo-button" aria-label="Volver al panel">
                <span class="logo-mark">ED</span>
            </a>
            <h1 class="brand-title">Crear administrador</h1>
        </div>
    </header>

    <main>
        <div class="auth-shell">
            <div class="auth-card">
                <h2>Nuevo usuario administrativo</h2>

                <form method="post" class="form-grid">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Crear usuario</button>
                </form>

                <a href="{% url 'gestion_admin:admin_panel' %}" class="back-button">Volver al panel</a>
            </div>
        </div>
    </main>
</body>
</html>
