

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi SITIO WEB</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Barra de navegación Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">BIENVENIDO A EMPANADAS ED</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'home' %}">Inicio</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 2. Contenido de carrusel (Inmediatamente después de la barra) -->
    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="carne.jpg" class="d-block w-100" alt="Empanada de Carne">
            </div>
            <div class="carousel-item">
                <img src="pollo.jpg" class="d-block w-100" alt="Empanada de Pollo">
            </div>  
            <div class="carousel-item">
                <img src="champinones.jpg" class="d-block w-100" alt="Empanada de Champiñones">
            </div>
            <div class="carousel-item">
                <img src="ranchera.jpg" class="d-block w-100" alt="Empanada  Ranchera">
            </div>
            <div class="carousel-item">
                <img src="queso.jpg" class="d-block w-100" alt="Empanada de Queso">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
        </button>
    </div>

    <!-- 3. Sección Parallax -->
    <section class="parallax-section d-flex align-items-center justify-content-center text-center text-white">
        <div class="container">
            <h1 class="display-4 fw-bold">Empanadas Artesanales</h1>
            <p class="lead">Una tradicion desde 1976.</p>
        </div>
    </section>

    <!-- 4. Contenido dinámico / principal -->
    <main class="container">
      
    </main>

    <!-- 5. Contenido normal -->
    <section class="py-5 bg-light text-dark">
        <div class="container">
            <h2>Contenido siguiente</h2>
            <p>Este es el texto que se desplaza normalmente sobre la página.</p>
        </div>
    </section>

    <!-- Bootstrap 5 JS Bundle (Al final del body) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
